name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      base_sha:
        type: string
        required: true
      upstream_sha:
        type: string
        required: true
      imported_sha:
        type: string
        required: true
      candidate_sha:
        type: string
        required: true

permissions:
  contents: read

# Cancel the superseded run when a branch gets rapid successive pushes/PR
# updates. Keyed on head_ref for PRs, run_id (never collides) for main pushes.
concurrency:
  group: ${{ toJSON(inputs) != '{}' && 'kleio-reusable-ci' || github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Cross-platform smoke matrix. Every push to main and every PR runs build +
# typecheck + test + bin-smoke on macOS, Linux, and Windows so we catch
# platform-specific regressions before they hit npm.
#
# The fork release group contains all five Kleio packages. Retired upstream
# projects remain active workspace members and are checked, not excluded.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # 30 not 15: most Windows runners are the slow kind, where the vitest
    # suite takes ~10.5 min and this job ~15 min (a fast runner needs ~9 min).
    # The verification gates run in the parallel `verify` job. Linux and macOS
    # take 8-10 min.
    timeout-minutes: 30
    defaults:
      run:
        shell: node "${{ github.workspace }}/control/scripts/verify-ci-candidate.mjs" shell bash {0}
        working-directory: subject
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.x]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: control

      - name: Verify and materialize exact checkout
        id: candidate
        shell: bash
        working-directory: control
        env:
          CANDIDATE_INPUTS: ${{ toJSON(inputs) }}
        run: node scripts/verify-ci-candidate.mjs materialize

      # pnpm version comes from the candidate package.json's packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: subject/package.json
          cache: false
          cache_dependency_path: subject/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ steps.candidate.outputs.mode == 'ordinary' && 'pnpm' || '' }}
          package-manager-cache: ${{ steps.candidate.outputs.mode == 'ordinary' }}
          cache-dependency-path: subject/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The trusted shell wrapper checks HEAD and invokes Bash with -e -o pipefail.
      # Bash on EVERY multi-line step is load-bearing, not cosmetic.
      # On Windows the default shell is PowerShell, which does not abort a
      # multi-line script when an intermediate command exits non-zero — only the
      # LAST line decides the step's outcome. So `ggcoder test` failing was
      # silently swallowed by `gg-boss test` succeeding right after it, and the
      # Windows leg reported SUCCESS while 72 ggcoder tests were failing. Every
      # Windows bug this suite was supposed to catch shipped through that gap.
      # The wrapper's explicit -e and pipefail make each failure fail the step.
      - name: Build framework packages
        run: |
          pnpm verify:versions
          pnpm -r build

      # Motion's media regressions decode real clips on every OS (upstream
      # 7e7cf885). CI-only provisioning is intentional; never skip these tests
      # when a tool is absent.
      - name: Ensure FFmpeg and ffprobe for Motion media tests
        run: |
          # A slow mirror has held apt-get for 20-30 min. Each try has a time limit
          # and apt's own fetch retries and timeouts; each command gets 3 tries. At
          # worst that's ~21 min, under verify-ci-candidate.mjs's 30-min step limit.
          apt_get() {
            limit=$1
            shift
            for try in 1 2 3; do
              if sudo timeout -k 20s "$limit" apt-get -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 "$@"; then
                return 0
              fi
              echo "::warning::apt-get $1 failed or ran past $limit (try $try of 3)"
              sudo dpkg --configure -a
              sleep 10
            done
            return 1
          }
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              Linux)
                apt_get 2m update
                apt_get 4m install -y --no-install-recommends ffmpeg
                ;;
              macOS) HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg ;;
              Windows) choco install ffmpeg --version=8.0.1 -y --no-progress ;;
              *) echo "Unsupported media-test runner: $RUNNER_OS" >&2; exit 1 ;;
            esac
          fi
          ffmpeg -version
          ffprobe -version

      - name: Test framework packages
        run: |
          pnpm -r test

      - name: Kleio canonical and legacy command smoke
        run: |
          node packages/ggcoder/dist/cli.js --help
          node packages/ggcoder/dist/cli.js --version
          node packages/gg-boss/dist/cli.js --help
          node packages/gg-boss/dist/cli.js --version

  verify:
    name: verify · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # 30 not 15: on a slow Windows runner the local regressions (~3 min),
    # packed consumer contracts (~6 min, up to ~7) and identity, lint and
    # format (~3.5 min) make this job ~18 min. These gates used to share one
    # job with vitest, which reached ~29.5 min against the same 30-min limit.
    timeout-minutes: 30
    defaults:
      run:
        shell: node "${{ github.workspace }}/control/scripts/verify-ci-candidate.mjs" shell bash {0}
        working-directory: subject
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.x]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: control

      - name: Verify and materialize exact checkout
        id: candidate
        shell: bash
        working-directory: control
        env:
          CANDIDATE_INPUTS: ${{ toJSON(inputs) }}
        run: node scripts/verify-ci-candidate.mjs materialize

      # pnpm version comes from the candidate package.json's packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: subject/package.json
          cache: false
          cache_dependency_path: subject/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ steps.candidate.outputs.mode == 'ordinary' && 'pnpm' || '' }}
          package-manager-cache: ${{ steps.candidate.outputs.mode == 'ordinary' }}
          cache-dependency-path: subject/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build framework packages
        run: |
          pnpm verify:versions
          pnpm -r build

      - name: Trusted local verification regressions
        run: |
          node --test "$KLEIO_CONTROL_ROOT/scripts/upstream-sync.test.mjs" "$KLEIO_CONTROL_ROOT/scripts/identity-audit.test.mjs" "$KLEIO_CONTROL_ROOT/scripts/consumer-contract.test.mjs" "$KLEIO_CONTROL_ROOT/scripts/verify-ci-candidate.test.mjs"

      - name: Packed public consumer contracts
        run: node "$KLEIO_CONTROL_ROOT/scripts/consumer-contract.mjs" --sha "$KLEIO_CI_SHA" --root . --registry-read

      # Preserve upstream performance baselines; intentional growth needs review.
      - name: Size + startup gates
        run: |
          node bench/size-gate.mjs --only dist:ggcoder
          node bench/startup-gate.mjs

      - name: Typecheck
        run: |
          pnpm -r check

      - name: Fork identity and workspace quality gates
        run: |
          pnpm audit:identity
          pnpm audit:identity:packed
          pnpm lint
          pnpm format:check

  # Distribution-critical cross-OS job: stages the per-platform Node runtime,
  # bundles the sidecar, boots it with the bundled runtime (smoke), and runs the
  # Rust unit tests that gate path/window-chrome resolution. The full
  # `tauri build` lives in release.yml; this keeps CI fast while still
  # exercising the per-OS spawn path that breaks installed bundles.
  app:
    name: app · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 45 not 30: the Windows leg compiles the Tauri tree and builds/launches
    # an MSI, taking 16-26 min with a warm Rust cache. Cold, it ran past 30
    # min, and a job cut off at its limit never saves the cache, so every
    # later run started cold again.
    timeout-minutes: 45
    defaults:
      run:
        shell: node "${{ github.workspace }}/control/scripts/verify-ci-candidate.mjs" shell bash {0}
        working-directory: subject
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: control

      - name: Verify and materialize exact checkout
        id: candidate
        shell: bash
        working-directory: control
        env:
          CANDIDATE_INPUTS: ${{ toJSON(inputs) }}
        run: node scripts/verify-ci-candidate.mjs materialize

      # pnpm version comes from the candidate package.json's packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: subject/package.json
          cache: false
          cache_dependency_path: subject/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: ${{ steps.candidate.outputs.mode == 'ordinary' && 'pnpm' || '' }}
          package-manager-cache: ${{ steps.candidate.outputs.mode == 'ordinary' }}
          cache-dependency-path: subject/pnpm-lock.yaml

      # Kleio's link (packages/kleio-link) pins iroh, and gg-app builds it, so
      # both lockfiles must name the same iroh and noq versions. Dependabot
      # bumps them in one pull request across both; this catches anything else.
      - name: Link lockfiles agree on iroh and noq
        run: |
          node --test scripts/check-link-locks.test.mjs
          node scripts/check-link-locks.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Both `cargo test` and the Windows packaged build compile the same large
      # Tauri dependency tree; without a cache the packaged smoke would rebuild
      # it from scratch on every run. Kleio's link (packages/kleio-link) has its
      # own lockfile and target folder, so it's a second workspace.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            subject/gg-app/src-tauri
            subject/packages/kleio-link
          save-if: ${{ steps.candidate.outputs.mode == 'ordinary' }}

      # Kleio's link and kleio-link-host, on every OS the host runs on.
      - name: Kleio link (format, clippy and tests)
        working-directory: subject/packages/kleio-link
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --features host -- -D warnings
          cargo test --locked --features host

      - name: Linux system deps (tauri)
        if: runner.os == 'Linux'
        run: |
          # A slow mirror has held apt-get for 20-30 min. Each try has a time limit
          # and apt's own fetch retries and timeouts; each command gets 3 tries. At
          # worst that's ~21 min, under verify-ci-candidate.mjs's 30-min step limit.
          apt_get() {
            limit=$1
            shift
            for try in 1 2 3; do
              if sudo timeout -k 20s "$limit" apt-get -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 "$@"; then
                return 0
              fi
              echo "::warning::apt-get $1 failed or ran past $limit (try $try of 3)"
              sudo dpkg --configure -a
              sleep 10
            done
            return 1
          }
          apt_get 2m update
          apt_get 4m install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      - name: Install
        run: pnpm install --frozen-lockfile

      # The Bash wrapper is required for the same reason as `test` — on Windows a
      # PowerShell multi-line step only reports the LAST line's exit code, so a
      # failing build here would pass silently.
      - name: Build framework packages
        run: |
          pnpm --filter @kleio/coder... build

      # Kleio's link end to end, on every OS the host runs on: the real
      # kleio-host and kleio-link-host, with a relay and a phone in the test
      # process (packages/kleio-link/tests/end_to_end.rs).
      - name: Kleio link end to end (kleio-host and kleio-link-host)
        run: |
          pnpm --filter @kleio/host build
          cargo test --locked --features host --manifest-path packages/kleio-link/Cargo.toml --test end_to_end -- --ignored

      - name: Stage node runtime + bundle sidecar
        run: |
          pnpm --filter gg-app stage:node
          pnpm --filter gg-app bundle:sidecar

      - name: Sidecar smoke (bundled runtime + bundle, per-OS)
        run: node gg-app/scripts/smoke-sidecar.mjs

      # OS-independent slice of the sidecar bundle (app-sidecar.mjs + skills;
      # node_modules carries platform-conditional binaries so one baseline
      # cannot hold across the matrix).
      - name: Sidecar size gate
        run: node bench/size-gate.mjs --only sidecar

      - name: Frontend build + initial JavaScript size gate
        run: |
          pnpm --filter gg-app build
          node bench/size-gate.mjs --only frontend:initial

      - name: Frontend platform-class test
        run: pnpm --filter gg-app test

      - name: Rust unit tests (path + window-chrome resolution)
        working-directory: subject/gg-app/src-tauri
        run: cargo test

      # Windows-only, and the ONLY job that exercises real installer output.
      # `smoke-sidecar` above proves the bundled runtime loads, but it launches
      # the sidecar directly — it cannot catch what actually breaks for a
      # Windows user who installed the app: the shell failing to find
      # `ggnode.exe` beside the exe, the sidecar resource missing from the MSI,
      # or the app starting with no visible window. This builds an MSI,
      # administratively extracts it (installs nothing), launches it with a
      # throwaway user profile, and requires a visible window plus a packaged
      # ggnode child running the packaged bundle.
      #
      # Only the Windows matrix leg pays the release-build cost; the macOS and
      # Linux legs run in parallel and stay fast.
      - name: Packaged app smoke (MSI build + launch)
        if: runner.os == 'Windows'
        working-directory: subject/gg-app
        run: pnpm smoke:packaged

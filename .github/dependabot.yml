version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Update the pnpm workspace from its root so package manifests and the shared
  # lockfile stay in sync. pnpm-workspace.yaml supplies the member directories;
  # Dependabot does not support updates from workspace subdirectories.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # These carry version-pinned pnpm patches (pnpm-workspace.yaml
    # patchedDependencies). Bumping one leaves its patch unused and pnpm fails
    # with ERR_PNPM_UNUSED_PATCH, so upgrade them by hand and regenerate the
    # patch (`pnpm patch <pkg>@<version>`).
    ignore:
      - dependency-name: hyperframes
      - dependency-name: border-beam
      # Tauri JS bindings must share major.minor with their Rust crates
      # (scripts/tauri-version-alignment.test.mjs), and Dependabot can't bump
      # npm and cargo in one PR. Patches flow; bump minors by hand on both
      # sides together (`cargo update -p tauri -p tauri-plugin-…`).
      - dependency-name: "@tauri-apps/api"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@tauri-apps/plugin-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Dependabot can't resolve the lockfile for these majors; upgrade them by hand.
      - dependency-name: diff
        versions: ["9.x"]
      - dependency-name: react-markdown
        versions: ["10.x"]

  # Tauri desktop app (gg-app).
  - package-ecosystem: cargo
    directory: /gg-app/src-tauri
    schedule:
      interval: weekly
    # Counterpart of the @tauri-apps ignore above.
    ignore:
      - dependency-name: tauri
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: tauri-plugin-*
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

name: gg-app
options:
  bundleIdPrefix: com.atlas.ggcoder
  deploymentTarget:
    iOS: 18.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Kleio
      PRODUCT_BUNDLE_IDENTIFIER: com.atlas.ggcoder
      DEVELOPMENT_TEAM: 35MTH2SNXQ
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  gg-app_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Assets.xcassets
      # The Rust library built here is linked (dependencies below), never
      # copied into the app as a resource.
      - path: Externals
        excludes:
          - "**/*.a"
      - path: gg-app_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: gg-app_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        CFBundleDisplayName: Kleio
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        NSFaceIDUsageDescription: Kleio uses Face ID before admin actions on your Kleio host, like pairing a new device.
        NSCameraUsageDescription: Kleio uses the camera to scan the pairing QR code from your host or computer.
        NSMicrophoneUsageDescription: Kleio uses your microphone when you talk to Kleio, or tap the mic to dictate a message.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 2.2.0
        CFBundleVersion: "55"
        # The lock screen and Dynamic Island view of what an agent is doing
        # (KleioWidgets); the host starts and updates it by push.
        NSSupportsLiveActivities: true
        # kleio://open?session=…|group=… — a tapped Live Activity opens its
        # conversation (src/kleio/live.rs).
        CFBundleURLTypes:
          - CFBundleURLName: kleio
            CFBundleURLSchemes: [kleio]
    entitlements:
      path: gg-app_iOS/gg-app_iOS.entitlements
      properties:
        # "Agent finished" notifications (kleio/phone.rs). Development
        # signing gets sandbox tokens; App Store signing switches this to
        # production on its own.
        aps-environment: development
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        # Sources/gg-app/KleioLiveActivities.swift, called from Rust; and
        # the Rust function Swift calls (a Live Activity button's answer).
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/gg-app/kleio-bridge.h
      groups: [app]
    dependencies:
      - target: KleioWidgets
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  # The Live Activity (lock screen + Dynamic Island). Not "_iOS" in its name:
  # the Tauri CLI patches the target whose name contains that.
  KleioWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: KleioWidgets
      - path: Shared
    info:
      path: KleioWidgets/Info.plist
      properties:
        CFBundleDisplayName: Kleio
        # Must match the app's.
        CFBundleShortVersionString: 2.2.0
        CFBundleVersion: "55"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: KleioWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.atlas.ggcoder.widgets
        DEVELOPMENT_TEAM: 35MTH2SNXQ
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
[package]
name = "gg-app"
version = "0.38.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gg_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Test-only packaged WebView instrumentation. Release artifacts never enable this.
native-smoke = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` + `image-png` are NOT default tauri features: the first adds the
# macOS menu-bar status item, the second lets `Image::from_bytes` decode the PNG
# tray mark (icons/tray-mac.png).
tauri = { version = "2", features = [
  "macos-private-api",
  "tray-icon",
  "image-png",
] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
keyring = { version = "=4.1.5", default-features = false, features = ["v1"] }
atomic-write-file = { version = "=0.3.0", default-features = false }
tokio = { version = "1", features = ["time"] }
base64 = "0.22"
tauri-plugin-notification = "2"

# Updater + process (relaunch) are desktop-only — the updater plugin doesn't
# build for mobile targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["UI_Notifications", "Win32_System_WinRT"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSError"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["block2", "UNNotificationSettings", "UNUserNotificationCenter"] }
tauri-plugin-wdio-webdriver = "=1.2.0"


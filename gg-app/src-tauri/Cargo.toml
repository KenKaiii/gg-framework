[package]
name = "gg-app"
version = "0.57.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gg_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` + `image-png` are NOT default tauri features: the first adds the
# macOS menu-bar status item, the second lets `Image::from_bytes` decode the PNG
# tray mark (icons/tray-mac.png).
tauri = { version = "2", features = [
  "macos-private-api",
  "tray-icon",
  "image-png",
] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `query` became an opt-in feature in 0.13. No TLS feature on purpose: every
# request goes to the local sidecar over plain http://127.0.0.1.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }

# Updater + process (relaunch) are desktop-only — the updater plugin doesn't
# build for mobile targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"


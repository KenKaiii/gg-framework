packages:
  - "packages/*"
  - "gg-app"

# Kept here, not in package.json's "pnpm" field: newer pnpm (used by
# Dependabot) no longer reads that field, which made its lockfiles drop these
# overrides and fail our frozen CI installs.
onlyBuiltDependencies:
  - esbuild
  - onnxruntime-node

# Install scripts we deliberately never run (supply-chain policy). Listing them
# records the decision and silences pnpm's "Ignored build scripts" notice:
#   opensrc    - postinstall downloads a native binary from GitHub.
#   protobufjs - postinstall only prints a version-scheme advisory.
#   sharp      - ships prebuilt @img/* binaries; no build needed.
ignoredBuiltDependencies:
  - opensrc
  - protobufjs
  - sharp

# The Claude Agent SDK's per-platform Claude Code binaries (~200 MB each) are
# never installed or bundled: GG Coder downloads the matching one on demand,
# sha512-pinned (packages/gg-core/src/claude-code/manifest.json).
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl"
  - "@anthropic-ai/claude-agent-sdk-linux-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64"
  - "@anthropic-ai/claude-agent-sdk-win32-x64"

overrides:
  global-agent: ^4.1.3
  ip-address: ^10.3.1
  protobufjs: ^7.6.1
  tar: ^7.5.19
  ws: ^8.21.0
  hono: ^4.13.1
  fast-uri: ^3.1.5
  picomatch: ^2.3.2

patchedDependencies:
  border-beam@1.3.0: patches/border-beam@1.3.0.patch
  hyperframes@0.8.82: patches/hyperframes@0.8.82.patch

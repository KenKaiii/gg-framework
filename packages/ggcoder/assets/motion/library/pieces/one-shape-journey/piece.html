<!doctype html>
<!--
  one-shape-journey: one element, four roles (move kit). A dot pops in,
  stretches into a progress bar that fills, morphs into a button, then into
  a square app icon while the product name rises beside it. The shape is
  never replaced: each change is the same element's box, radius and colour
  (kit.reshape), and the text inside changes by quick label swaps.
  Needs the move kit: `library.mjs add` installs it; put its <script> in the
  root head after GSAP.
  Params (script top): BOXES (the shape's rect for each role, stage px:
  x, y = top-left), STEPS (when each morph starts), FILL (progress fill
  start and length), SWAP (label swap out/in time), LABELS (the text
  shown inside, from the markup's data-* attributes).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div
      id="one-shape-journey-root"
      data-composition-id="one-shape-journey"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <style>
        [data-composition-id="one-shape-journey"] {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: var(--ink, #111);
          font-family: var(--text, sans-serif);
        }
        [data-composition-id="one-shape-journey"] .os-stage {
          position: absolute;
          inset: 0;
        }
        [data-composition-id="one-shape-journey"] .os-shape {
          position: absolute;
          left: 936px;
          top: 516px;
          width: 48px;
          height: 48px;
          border-radius: 24px;
          overflow: hidden;
          background: var(--ink, #111);
          opacity: 0;
        }
        [data-composition-id="one-shape-journey"] .os-fill {
          position: absolute;
          left: 0;
          top: 0;
          bottom: 0;
          width: 0%;
          background: var(--accent, #2f5bff);
        }
        [data-composition-id="one-shape-journey"] .os-label {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          white-space: nowrap;
          color: var(--field, #fff);
          line-height: 1;
        }
        [data-composition-id="one-shape-journey"] .os-label.is-mono {
          font-family: var(--mono, monospace);
          font-size: 30px;
          letter-spacing: 0.06em;
        }
        [data-composition-id="one-shape-journey"] .os-label.is-text {
          font-family: var(--text, sans-serif);
          font-weight: 600;
          font-size: 44px;
        }
        [data-composition-id="one-shape-journey"] .os-label.is-glyph {
          font-family: var(--display, sans-serif);
          font-weight: var(--display-weight, 700);
          font-stretch: var(--display-stretch, 100%);
          font-size: 136px;
        }
        [data-composition-id="one-shape-journey"] .os-name {
          position: absolute;
          left: 820px;
          top: 448px;
          white-space: nowrap;
        }
        [data-composition-id="one-shape-journey"] .os-title {
          font-family: var(--display, sans-serif);
          font-weight: var(--display-weight, 700);
          font-stretch: var(--display-stretch, 100%);
          letter-spacing: var(--display-tracking, -0.02em);
          font-size: 150px;
          line-height: 1;
        }
        [data-composition-id="one-shape-journey"] .os-tag {
          margin-top: 18px;
          font-family: var(--mono, monospace);
          font-size: 26px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--muted, #666);
        }
      </style>
      <!-- edit: data-progress = bar label prefix, data-button = button text, data-glyph = icon letter -->
      <div class="os-stage" data-progress="Uploading" data-button="Open the app" data-glyph="n">
        <div class="os-shape">
          <div class="os-fill"></div>
          <div class="os-label"></div>
        </div>
        <div class="os-name">
          <!-- edit: product name -->
          <div class="os-title">notably</div>
          <!-- edit: tagline -->
          <div class="os-tag">Now on every device</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const kit = window.GGMotionKit;
        const root = document.querySelector('[data-composition-id="one-shape-journey"]');
        const stage = root.querySelector(".os-stage");
        const shape = root.querySelector(".os-shape");
        const fill = root.querySelector(".os-fill");
        const label = root.querySelector(".os-label");
        const title = root.querySelector(".os-title");
        const tag = root.querySelector(".os-tag");
        const tl = gsap.timeline({ paused: true });

        const DURATION = 6;
        const BOXES = {
          bar: { x: 560, y: 504, w: 800, h: 72, r: 36 },
          button: { x: 740, y: 476, w: 440, h: 128, r: 64 },
          icon: { x: 560, y: 440, w: 200, h: 200, r: 48 },
        };
        const STEPS = { dot: 0.2, bar: 0.85, button: 2.75, icon: 3.95 };
        const FILL = { at: 1.3, duration: 1.3 };
        const SWAP = 0.09;
        const LABELS = {
          progress: stage.dataset.progress,
          button: stage.dataset.button,
          glyph: stage.dataset.glyph,
        };

        // Role 1: a dot.
        kit.pop(tl, shape, STEPS.dot, { from: 0.1 });
        // Role 2: the same dot stretches into a bar and fills.
        kit.reshape(tl, shape, STEPS.bar, BOXES.bar, { spring: "whip" });
        const fillEnd = FILL.at + FILL.duration;
        // Role 3: the full bar gathers into a button.
        kit.reshape(tl, shape, STEPS.button, BOXES.button, { spring: "whip" });
        // Role 4: the button squares up into the app icon and darkens to ink.
        kit.reshape(tl, shape, STEPS.icon, BOXES.icon, { spring: "heavy" });
        const nameAt = kit.liftWords(tl, title, STEPS.icon + 0.35);
        kit.liftWords(tl, tag, nameAt);

        // Fill amount, and what the label says when: one seek-safe draw.
        const progress = (t) => kit.ease.travel(Math.min(1, Math.max(0, (t - FILL.at) / FILL.duration)));
        const iconFill = (t) => 1 - kit.ease.snap(Math.min(1, Math.max(0, (t - STEPS.icon) / 0.35)));
        const plan = [
          { at: FILL.at, cls: "is-mono", text: (t) => `${LABELS.progress} ${Math.round(progress(t) * 100)}%` },
          { at: STEPS.button + 0.12, cls: "is-text", text: () => LABELS.button },
          { at: STEPS.icon + 0.12, cls: "is-glyph", text: () => LABELS.glyph },
        ];
        kit.drive(tl, 0, DURATION, (t) => {
          fill.style.width = `${(t < STEPS.icon ? progress(t) : iconFill(t)) * 100}%`;
          let i = -1;
          while (i + 1 < plan.length && plan[i + 1].at <= t) i++;
          if (i < 0) {
            label.textContent = "";
            return;
          }
          const step = plan[i];
          const since = t - step.at;
          const until = i + 1 < plan.length ? plan[i + 1].at - t : Infinity;
          // Quick swap: the old label drops out just before, the new one rises in.
          const inP = Math.min(1, since / SWAP);
          const outP = Math.min(1, Math.max(0, 1 - until / SWAP));
          label.className = `os-label ${step.cls}`;
          label.textContent = step.text(t);
          label.style.opacity = String(Math.min(inP, 1 - outP));
          label.style.transform = `translateY(${(1 - kit.ease.snap(inP)) * 40 - outP * 40}%)`;
        });

        window.__timelines = window.__timelines || {};
        window.__timelines["one-shape-journey"] = tl;
      })();
    </script>
  </body>
</html>
